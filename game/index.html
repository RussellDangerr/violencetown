<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="0.7.0">
    <meta name="description" content="Violencetown — a browser-based 2D RPG with tick-based combat, an Omnitrix-style radial menu, and hand-authored zones. Zero dependencies, no build step, just open and play.">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="color-scheme" content="dark">

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Violencetown">
    <meta property="og:description" content="A browser-based 2D RPG of small violences. Tick-based combat, radial menu, vanilla JS.">
    <meta property="og:url" content="https://violencetown.russelldangerr.com/game/">
    <meta property="og:image" content="https://violencetown.russelldangerr.com/game/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Violencetown">
    <meta name="twitter:description" content="A browser-based 2D RPG of small violences.">
    <meta name="twitter:image" content="https://violencetown.russelldangerr.com/game/og-card.png">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">

    <title>Violencetown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash — rendered on its own canvas for pixel art consistency -->
    <div id="splash">
        <canvas id="splash-canvas"></canvas>
        <div id="splash-buttons">
            <button id="splash-go">GAME START</button>
            <button id="splash-continue" class="hidden">CONTINUE</button>
        </div>
        <div id="splash-hint">press Space</div>
    </div>

    <div id="game-wrapper" class="hidden">
        <div id="game-layout">
            <canvas id="game-canvas"></canvas>
            <div id="log-panel">
                <div id="text-log"></div>
            </div>
        </div>
        <button id="menu-btn" aria-label="open menu">☰</button>
        <div id="version-badge" aria-label="game version"></div>

        <div id="touch-controls">
            <div id="touch-dpad">
                <button class="tc-btn" data-key="ArrowUp"    aria-label="move up">▲</button>
                <button class="tc-btn" data-key="ArrowLeft"  aria-label="move left">◀</button>
                <button class="tc-btn" data-key="ArrowDown"  aria-label="move down">▼</button>
                <button class="tc-btn" data-key="ArrowRight" aria-label="move right">▶</button>
            </div>
        </div>

        <!-- Action sheet — opened by the MENU button. Wait / Cancel / Help /
             Restart replace the previous standalone WAIT + NEW buttons.
             Hidden by default; toggled via .open class from main.js. -->
        <div id="menu-sheet" class="hidden" role="dialog" aria-label="game menu" aria-modal="true">
            <div id="menu-sheet-backdrop"></div>
            <div id="menu-sheet-panel">
                <button class="menu-item" data-action="wait">WAIT</button>
                <button class="menu-item" data-action="cancel">CANCEL</button>
                <button class="menu-item" data-action="help">HELP (?)</button>
                <button class="menu-item menu-item-danger" data-action="restart">RESTART</button>
                <button class="menu-item menu-item-close" data-action="close">CLOSE</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
