<title>Violencetown Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root {
    --bg: #f6f1e7; --panel: #fffaf0; --ink: #2a1f06; --muted: #7a6a4a;
    --line: #d9c9a8; --accent: #8a5a2c; --gold: #d4b96a;
    --ruling: #f3d9a4; --build: #cfe8c9; --design: #d9d4ee; --later: #e6e6e6; --done: #dfe9e0;
    --lift: 0 2px 8px rgba(42,31,6,.12);
    --on-gold: #2a1f06;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1610; --panel: #241f16; --ink: #f3e3c0; --muted: #b9a684;
      --line: #4a3d28; --accent: #d4b96a; --gold: #d4b96a;
      --ruling: #4a3a1a; --build: #223a22; --design: #2c2640; --later: #333; --done: #1f2a20;
      --lift: 0 2px 10px rgba(0,0,0,.5);
      --on-gold: #2a1f06;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1610; --panel: #241f16; --ink: #f3e3c0; --muted: #b9a684;
    --line: #4a3d28; --accent: #d4b96a; --gold: #d4b96a;
    --ruling: #4a3a1a; --build: #223a22; --design: #2c2640; --later: #333; --done: #1f2a20;
    --lift: 0 2px 10px rgba(0,0,0,.5);
    --on-gold: #2a1f06;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  /* The artifact host's wrapper normally supplies this; outside it (dist/index.html
     served or opened standalone) an author rule beats the UA default, so [hidden]
     needs its own !important or e.g. .rail{display:flex} wins and the graph view
     leaves the board visible. */
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  h1, h2 { font-family: 'VT323', ui-monospace, "Cascadia Mono", Consolas, monospace; font-weight: 400; text-wrap: balance; margin: 0; }
  p { margin: 0; }
  button { font-family: inherit; }

  /* ── Header ─────────────────────────────────────────────────────────── */
  .bar {
    display: grid; grid-template-columns: 1fr auto; column-gap: 20px; row-gap: 4px;
    padding: 14px 20px; border-bottom: 2px solid var(--line); background: var(--panel);
  }
  .bar h1 { grid-column: 1; grid-row: 1; font-size: 32px; letter-spacing: .02em; }
  .bar nav { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 6px; }
  .bar #status { grid-column: 1; grid-row: 2; font-size: 12.5px; color: var(--muted); }
  .bar .hint { grid-column: 1; grid-row: 3; font-size: 11px; color: var(--muted); }
  .bar nav button {
    font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--bg); color: var(--muted); cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .bar nav button:hover { border-color: var(--accent); color: var(--ink); }
  .bar nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .bar nav button[aria-pressed="true"]:hover { color: var(--panel); }
  .bar nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 480px) {
    .bar { grid-template-columns: 1fr; }
    .bar nav { grid-column: 1; grid-row: 4; justify-self: start; margin-top: 4px; }
  }

  /* ── Unblocked strip — the one bright moment on the page ───────────── */
  #unblocked {
    display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; overflow-x: auto;
    padding: 10px 20px; background: var(--gold); border-bottom: 1px solid var(--line);
  }
  #unblocked h2 { flex: none; font-size: 19px; color: var(--on-gold); white-space: nowrap; }
  #unblocked .chips { display: flex; gap: 8px; flex-wrap: nowrap; }
  #unblocked .muted { color: var(--on-gold); opacity: .85; font-style: italic; font-size: 12.5px; white-space: nowrap; }

  /* ── Lane rail ──────────────────────────────────────────────────────── */
  .rail { display: flex; align-items: flex-start; gap: 14px; padding: 16px 20px; overflow-x: auto; }
  .lane {
    flex: 0 0 300px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line);
    border-top: 4px solid var(--line); border-radius: 4px;
  }
  .lane[data-lane="ruling"] { border-top-color: var(--ruling); }
  .lane[data-lane="ready"], .lane[data-lane="doing"], .lane[data-lane="review"] { border-top-color: var(--build); }
  .lane[data-lane="idea"] { border-top-color: var(--design); }
  .lane[data-lane="someday"] { border-top-color: var(--later); }
  .lane[data-lane="done"] { border-top-color: var(--done); }
  .lane h2 {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px;
    padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
    font-size: 21px; text-transform: uppercase; letter-spacing: .06em;
  }
  .lane h2 .count {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px;
    text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px;
    color: var(--muted);
  }
  .lane h2 small {
    flex-basis: 100%; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 400; color: var(--muted);
  }
  .cards { display: flex; flex-direction: column; gap: 10px; padding: 12px; min-height: 32px; }
  .cards:empty::after {
    content: "— empty —"; display: block; text-align: center; padding: 8px 0;
    color: var(--muted); font-size: 11px; font-style: italic;
  }

  /* ── Card ───────────────────────────────────────────────────────────── */
  .card {
    position: relative; display: flex; flex-direction: column; gap: 6px;
    background: var(--bg); border: 1px solid var(--line); border-left: 5px solid var(--muted);
    border-radius: 2px; padding: 10px 12px 10px 10px; cursor: default;
    transition: opacity .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .card[draggable="true"] { cursor: grab; }
  .card.ruling { border-left-color: var(--ruling); }
  .card.slice  { border-left-color: var(--build); }
  .card.idea   { border-left-color: var(--design); }
  .card.someday { border-left-color: var(--later); }
  .card.done   { border-left-color: var(--done); border-left-style: dashed; opacity: .82; }
  .card .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: auto; padding-left: 8px; }
  .card ul { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .card .label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .card code { font-size: 11.5px; }

  /* ── Ruling options ─────────────────────────────────────────────────── */
  .options { display: flex; flex-direction: column; gap: 6px; }
  .opt {
    text-align: left; font-size: 12.5px; line-height: 1.4; padding: 7px 9px; cursor: pointer;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 3px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .opt small { display: block; color: var(--muted); font-size: 11.5px; }
  .opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; opacity: .75; }
  .opt.rec { border-color: var(--gold); }
  .opt.picked { background: var(--ruling); border-color: var(--accent); }
  .pick-note {
    width: 100%; font: inherit; font-size: 12px; padding: 5px 7px; resize: vertical; min-height: 30px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 3px;
  }

  /* ── Idea box ───────────────────────────────────────────────────────── */
  #ideabox { display: flex; gap: 8px; align-items: flex-start; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #ideabox textarea {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 7px 9px; min-height: 38px; resize: vertical;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 3px;
  }
  #ideabox textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #ideabox button {
    font-size: 13px; padding: 8px 14px; border: 1px solid var(--accent); border-radius: 3px;
    background: var(--accent); color: var(--panel); cursor: pointer;
  }
  #ideabox button:disabled { opacity: .5; cursor: default; }
  .card.dim { opacity: .35; }
  .card.lifting { box-shadow: var(--lift); opacity: .92; transform: scale(1.015); cursor: grabbing; }
  .card.blocked { padding-right: 16px; }
  .card.blocked::after {
    content: ""; position: absolute; top: 6px; right: 0; bottom: 6px; width: 6px;
    background: repeating-linear-gradient(-45deg, var(--muted) 0 4px, transparent 4px 8px);
    opacity: .5; border-radius: 3px;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card header b { font-size: 13.5px; letter-spacing: .03em; color: var(--accent); }
  .card header em {
    font-style: normal; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px; padding: 0 5px;
    font-variant-numeric: tabular-nums;
  }
  .card .title { color: var(--ink); font-weight: 600; line-height: 1.45; }
  .card .note  { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  /* .card.done already sits at opacity:.82 — muted-on-muted fails contrast, so
     done notes get a non-muted colour to clear 4.5:1 in light theme. */
  .card.done .note { color: var(--ink); }
  .card .doc   {
    color: var(--muted); font-size: 11.5px; font-style: italic; line-height: 1.4;
    padding-top: 5px; border-top: 1px dashed var(--line);
  }
  .card .row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .card .row span { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

  /* ── Chips ──────────────────────────────────────────────────────────── */
  .chip {
    font: 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: nowrap; flex: none;
    padding: 3px 9px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
  }
  button.chip { cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease; }
  button.chip:hover, button.chip:focus-visible { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.ruling { background: var(--ruling); }
  .chip.slice  { background: var(--build); }
  .chip.idea   { background: var(--design); }
  .chip.someday { background: var(--later); }
  .chip.done   { background: var(--done); }
  #unblocked .next { font-size: 13px; color: var(--on-gold); white-space: nowrap; }
  #unblocked .next b { font-weight: 700; }
  #unblocked.turns { flex-direction: column; align-items: stretch; gap: 8px; overflow-x: visible; }
  .turnrow { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .turnrow h2 { min-width: 150px; }
  .turnrow .chips { flex-wrap: wrap !important; }

  /* ── Card gestures + feedback ───────────────────────────────────────── */
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .act {
    font-size: 12.5px; padding: 6px 12px; cursor: pointer; border-radius: 3px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  }
  .act.go { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .act:hover:not(:disabled), .act:focus-visible { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .act:disabled { opacity: .5; cursor: default; }
  .state { font-size: 11.5px; color: var(--accent); font-weight: 600; }
  details.fb { border-top: 1px dashed var(--line); padding-top: 5px; }
  details.fb summary { cursor: pointer; font-size: 11.5px; color: var(--muted); }
  details.fb summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details.fb[data-waiting="claude"] summary { color: var(--accent); }
  .thread { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .thread p { font-size: 12px; line-height: 1.4; padding: 4px 7px; border-radius: 3px; background: var(--panel); border: 1px solid var(--line); }
  .thread p.claude { border-left: 3px solid var(--ruling); }
  .thread p b { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-right: 4px; }
  .fb-row { display: flex; gap: 6px; align-items: flex-start; }
  .fb-row textarea { flex: 1; min-width: 0; }
  .chip.ghost  { background: transparent; color: var(--muted); border-style: dashed; font-style: italic; cursor: default; }

  /* ── Graph view ─────────────────────────────────────────────────────── */
  #graph { padding: 16px 20px; }
  #graph pre.mermaid {
    margin: 0; overflow: auto; max-width: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 20px;
    font: 12px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink);
    white-space: pre;
  }

  /* ── Scrollbars (Chromium; harmless no-op elsewhere) ───────────────── */
  .rail::-webkit-scrollbar, #unblocked::-webkit-scrollbar, #graph pre.mermaid::-webkit-scrollbar { height: 10px; width: 10px; }
  .rail::-webkit-scrollbar-track, #unblocked::-webkit-scrollbar-track, #graph pre.mermaid::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb, #unblocked::-webkit-scrollbar-thumb, #graph pre.mermaid::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  /* ── Motion ─────────────────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>

<header class="bar">
  <h1>Violencetown Board</h1>
  <p class="sub" id="status">loading…</p>
  <p class="hint">Ideas → rulings → ready slices → the loop → your merge. Dragging needs a mouse; Tab, chips and the ruling buttons work without one.</p>
  <nav>
    <button id="view-board" aria-pressed="true">Board</button>
    <button id="view-graph" aria-pressed="false">Graph</button>
  </nav>
</header>

<form id="ideabox" hidden>
  <textarea id="idea-words" rows="1" aria-label="A new idea, in your words" placeholder="Drop an idea — your words, as many lines as you like. Claude tweaks it later."></textarea>
  <button type="submit" id="idea-add">Add idea</button>
</form>
<section id="unblocked" class="turns" aria-label="Whose turn"></section>
<main id="board" class="rail" aria-label="Lanes"></main>
<section id="graph" hidden><pre class="mermaid" id="mermaid-src"></pre></section>

<script>
// board-model.js — the ticket board's logic, with no DOM and no `claude`.
//
// Pure so it can be node-tested. The page inlines this file at build time
// (tools/roadmap-board/build.py) — do not import anything here, and do not
// reference window/document. The artifact runtime is wired in page.html.
//
// Inputs may be FROZEN: the artifact db delivers frozen snapshots. Every
// function here reads its input and returns new objects; nothing mutates.
//
// The model (plans/ticket-board.md §2): three kinds — idea, ruling, slice —
// moving through seven lanes. nextSlice() is the one place that decides what
// the loop builds next.

const LANES = [
    { id: 'idea',    label: 'Ideas',        hint: 'his words — not tweaked yet' },
    { id: 'ruling',  label: 'Needs ruling', hint: 'your call — pick an option' },
    { id: 'ready',   label: 'Ready',        hint: 'tweaked slices the loop can take' },
    { id: 'doing',   label: 'In progress',  hint: 'claimed by a loop run' },
    { id: 'review',  label: 'Review',       hint: 'branch pushed — your merge call' },
    { id: 'done',    label: 'Done',         hint: 'do not re-implement' },
    { id: 'someday', label: 'Someday',      hint: 'parked on purpose' },
];

const KINDS = ['idea', 'ruling', 'slice'];
const WIP_CAP = 2;

const isDone = c => c.lane === 'done';

// The store is org-writable — any viewer can write any string into `lane`,
// `kind` or `blockedBy`. Two defenses run through every function below:
// accumulators are Object.create(null) so a card carrying "__proto__" can't
// collide with the prototype chain and crash a `.push()`, and a lane outside
// the known ids falls back to Ideas instead of being dropped — a card you can
// see is better than one that silently disappears, and an unknown card most
// likely needs tweaking.
const LANE_IDS = new Set(LANES.map(l => l.id));
const KIND_IDS = new Set(KINDS);
const FALLBACK_LANE = 'idea';
const laneOf = c => LANE_IDS.has(c.lane) ? c.lane : FALLBACK_LANE;
const kindOf = c => KIND_IDS.has(c.kind) ? c.kind : 'idea';

function byLane(cards) {
    const out = Object.create(null);
    for (const l of LANES) out[l.id] = [];
    for (const c of cards) out[laneOf(c)].push(c);
    for (const k of Object.keys(out)) out[k] = [...out[k]].sort((a, b) => a.order - b.order);
    return out;
}

// blocks   : id -> ids it blocks          (derived — the inverse of blockedBy)
// blockedBy: id -> ids that block it      (as stored)
// openBlockedBy: same, minus blockers that are already done
function blockerIndex(cards) {
    const byId = Object.create(null);
    for (const c of cards) byId[c.id] = c;
    const blocks = Object.create(null), blockedBy = Object.create(null), openBlockedBy = Object.create(null);
    for (const c of cards) {
        blockedBy[c.id] = [...(c.blockedBy ?? [])];
        // An id with no matching card (typo, or a card since deleted) still blocks —
        // failing closed makes the typo visible instead of quietly unblocking the card.
        openBlockedBy[c.id] = blockedBy[c.id].filter(b => !byId[b] || !isDone(byId[b]));
        for (const b of blockedBy[c.id]) (blocks[b] ??= []).push(c.id);
    }
    return { blocks, blockedBy, openBlockedBy };
}

// Slices waiting in Ready with every blocker done. (Claims and file overlap
// are nextSlice's business; this is the board's "could start" view.)
function unblocked(cards) {
    const ix = blockerIndex(cards);
    return cards.filter(c => kindOf(c) === 'slice' && laneOf(c) === 'ready' && ix.openBlockedBy[c.id].length === 0);
}

// A path as a run would compare it: forward slashes, no leading ./, trimmed.
const normPath = p => String(p ?? '').trim().replace(/\\/g, '/').replace(/^\.\//, '');

// What the loop builds next (plans/ticket-board.md §2). Returns
//   { pick, reason, wip, skipped }
// reason: 'ok' | 'wip-cap' | 'nothing-pickable'. `skipped` lists every Ready
// slice that was passed over, with why, so a run can report it.
function nextSlice(cards, { wipCap = WIP_CAP } = {}) {
    const lanes = byLane(cards);
    const inFlight = [...lanes.doing, ...lanes.review].filter(c => kindOf(c) === 'slice');
    const wip = inFlight.length;
    if (wip >= wipCap) return { pick: null, reason: 'wip-cap', wip, skipped: [] };

    const busy = new Set(inFlight.flatMap(c => (c.touches ?? []).map(normPath)));
    const ix = blockerIndex(cards);
    const skipped = [];
    for (const c of lanes.ready) {
        if (kindOf(c) !== 'slice') { skipped.push({ id: c.id, why: 'not a slice' }); continue; }
        if (c.claim) { skipped.push({ id: c.id, why: 'already claimed' }); continue; }
        // A slice with no acceptance checks has not been tweaked — the roadmap's old
        // rows arrive like this. A run must never guess what "done" means.
        if (!Array.isArray(c.acceptance) || !c.acceptance.length) { skipped.push({ id: c.id, why: 'not tweaked (no acceptance)' }); continue; }
        if (!c.approved) { skipped.push({ id: c.id, why: 'waiting for your approval' }); continue; }
        const open = ix.openBlockedBy[c.id];
        if (open.length) { skipped.push({ id: c.id, why: `blocked by ${open.join(', ')}` }); continue; }
        const clash = (c.touches ?? []).map(normPath).filter(p => busy.has(p));
        if (clash.length) { skipped.push({ id: c.id, why: `touches unmerged ${clash.join(', ')}` }); continue; }
        return { pick: c, reason: 'ok', wip, skipped };
    }
    return { pick: null, reason: 'nothing-pickable', wip, skipped };
}

// His answer to a ruling: the pick is stored on the card and the card moves to
// Done, which unblocks whatever it gated. An option the card does not offer is
// refused (returns the input unchanged) rather than stored.
function answerRuling(cards, id, { option, note = '', at }) {
    const card = cards.find(c => c.id === id);
    if (!card || kindOf(card) !== 'ruling') return cards;
    if (!(card.options ?? []).some(o => o.id === option)) return cards;
    const doneOrder = (byLane(cards).done.at(-1)?.order ?? 0) + 10;
    return cards.map(c => c.id === id
        ? { ...c, lane: 'done', order: doneOrder, pick: { option, note: String(note), at } }
        : c);
}

// ── His gestures (plans/ticket-board.md §8) ──────────────────────────────────
// Each returns a NEW array with only that card changed, or the input unchanged
// when the gesture does not apply to that card — a stale click is a no-op.
const isTweaked = c => Array.isArray(c.acceptance) && c.acceptance.length > 0;
const swap = (cards, id, fn) => cards.map(c => c.id === id ? fn(c) : c);
const findCard = (cards, id) => cards.find(c => c.id === id);

// Idea triage: 'tweak' asks Claude to tweak it; 'someday' parks it.
function triageIdea(cards, id, choice, at) {
    const c = findCard(cards, id);
    if (!c || kindOf(c) !== 'idea' || !['tweak', 'someday'].includes(choice)) return cards;
    const someday = choice === 'someday';
    const order = someday ? (byLane(cards).someday.at(-1)?.order ?? 0) + 10 : c.order;
    return swap(cards, id, x => ({ ...x, triage: { choice, at }, ...(someday ? { lane: 'someday', order } : {}) }));
}

// A tweaked Ready slice may be built once he approves it.
function approveSlice(cards, id, at) {
    const c = findCard(cards, id);
    if (!c || kindOf(c) !== 'slice' || laneOf(c) !== 'ready' || !isTweaked(c)) return cards;
    return swap(cards, id, x => ({ ...x, approved: { at } }));
}

// His call on a pushed branch: 'merge' or 'changes' (a note says which).
function reviewVerdict(cards, id, verdict, note, at) {
    const c = findCard(cards, id);
    if (!c || laneOf(c) !== 'review' || !['merge', 'changes'].includes(verdict)) return cards;
    return swap(cards, id, x => ({ ...x, verdict: { verdict, note: String(note ?? ''), at } }));
}

// The thread on a card. `from` is 'you' (the page) or 'claude' (a run).
function addFeedback(cards, id, text, at, from = 'you') {
    const t = String(text ?? '').trim();
    if (!t || !findCard(cards, id)) return cards;
    return swap(cards, id, x => ({ ...x, feedback: [...(Array.isArray(x.feedback) ? x.feedback : []), { from, text: t, at }] }));
}
const lastFrom = c => (Array.isArray(c.feedback) && c.feedback.length ? c.feedback.at(-1).from : null);

// What waits on him, and what waits on Claude. Each item: { id, why }.
function yourTurn(cards) {
    const out = [];
    for (const c of cards) {
        const k = kindOf(c), l = laneOf(c);
        if (k === 'ruling' && l === 'ruling' && Array.isArray(c.options) && c.options.length && !c.pick) out.push({ id: c.id, why: 'pick an option' });
        else if (k === 'idea' && l === 'idea' && !c.triage) out.push({ id: c.id, why: 'tweak it or park it' });
        else if (k === 'slice' && l === 'ready' && isTweaked(c) && !c.approved) out.push({ id: c.id, why: 'approve it' });
        else if (l === 'review' && !c.verdict) out.push({ id: c.id, why: 'merge it or ask for changes' });
        else if (lastFrom(c) === 'claude' && c.feedback.at(-1).ask) out.push({ id: c.id, why: 'Claude asked you something' });
    }
    return out;
}
function claudesTurn(cards) {
    const out = [];
    for (const c of cards) {
        if (lastFrom(c) === 'you') out.push({ id: c.id, why: 'reply to your feedback' });
        else if (kindOf(c) === 'idea' && c.triage?.choice === 'tweak' && laneOf(c) === 'idea') out.push({ id: c.id, why: 'tweak it' });
        else if (laneOf(c) === 'review' && c.verdict) out.push({ id: c.id, why: c.verdict.verdict === 'merge' ? 'merge it' : 'make the changes' });
        else if (kindOf(c) === 'ruling' && laneOf(c) === 'ruling' && !(Array.isArray(c.options) && c.options.length)) out.push({ id: c.id, why: 'write its options' });
        else if (kindOf(c) === 'slice' && laneOf(c) === 'ready' && !isTweaked(c)) out.push({ id: c.id, why: 'tweak it (no acceptance checks yet)' });
    }
    return out;
}

// A thought dropped in the idea box. `now` is a millisecond timestamp, passed in
// so this stays pure. The title is the first line, cut short; his full words
// are the note.
function newIdea(words, now, cards = []) {
    const text = String(words ?? '').trim();
    if (!text) return null;
    const first = text.split(/\r?\n/)[0];
    const title = first.length > 90 ? `${first.slice(0, 90)}…` : first;
    const order = (byLane(cards).idea.at(-1)?.order ?? 0) + 10;
    return { id: `idea-${now.toString(36)}`, title, kind: 'idea', lane: 'idea', order, blockedBy: [], note: text, doc: '', size: '' };
}

// The one-time move from the roadmap-seeded board (plans/ticket-board.md §3).
// Idempotent: a card already in the new model passes through unchanged.
const LANE_MAP = { now: 'ready', rulings: 'ruling', ready: 'ready', design: 'idea', later: 'someday', done: 'done' };
const KIND_MAP = { build: 'slice', ruling: 'ruling', design: 'idea', later: 'idea' };
function migrateCard(c) {
    const lane = Object.hasOwn(LANE_MAP, c.lane) ? LANE_MAP[c.lane] : laneOf(c);
    // Old done cards carried kind 'done'; keep what they were if it is known,
    // else call them slices — they were builds that shipped.
    const kind = Object.hasOwn(KIND_MAP, c.kind) ? KIND_MAP[c.kind] : KIND_IDS.has(c.kind) ? c.kind : 'slice';
    return { ...c, lane, kind };
}

const mmId = id => id.replace(/[^A-Za-z0-9_]/g, '_');
// A short code (A1, DZ, ENT, F2b: up to 3 letters, a digit, a lower-case suffix)
// IS its own label. Anything else is a slug or a sentence — use the title,
// truncated, so a node never carries both an id AND a long title.
const SHORT_CODE = /^[A-Z]{1,3}\d?[a-z]?$/;
const truncate = (s, n) => s.length > n ? `${s.slice(0, n)}…` : s;
const mmLabel = c => (SHORT_CODE.test(c.id) ? c.id : truncate(c.title, 40)).replace(/"/g, "'").replace(/[<>]/g, '');
const mmClass = c => isDone(c) ? 'done' : laneOf(c) === 'someday' ? 'someday' : kindOf(c);
const mmNode = c => `${mmId(c.id)}["${mmLabel(c)}"]:::${mmClass(c)}`;

// One node per card that participates in an edge; one edge per blockedBy.
// Cards with no edges are otherwise omitted, so anything free to start but
// friendless gets its own terminal group instead of vanishing.
function mermaidSource(cards) {
    const byId = Object.create(null);
    for (const c of cards) byId[c.id] = c;
    const inEdge = new Set();
    const edges = [];
    for (const c of cards) for (const b of c.blockedBy ?? []) {
        if (!byId[b]) continue;
        inEdge.add(c.id); inEdge.add(b);
        edges.push(`    ${mmId(b)} --> ${mmId(c.id)}`);
    }
    const nodes = cards.filter(c => inEdge.has(c.id)).map(mmNode);
    const free = unblocked(cards).filter(c => !inEdge.has(c.id));
    const freeGroup = free.length === 0 ? [] : [
        '    subgraph free["Free to start"]',
        ...free.map(c => `        ${mmNode(c)}`),
        '    end',
    ];
    return [
        'flowchart LR',
        '    classDef idea    fill:#d9d4ee,stroke:#5a4a8a,color:#1f1a33',
        '    classDef ruling  fill:#f3d9a4,stroke:#8a5a2c,color:#2a1f06',
        '    classDef slice   fill:#cfe8c9,stroke:#3a6b35,color:#0f2a0d',
        '    classDef someday fill:#e6e6e6,stroke:#777,color:#333',
        '    classDef done    fill:#dfe9e0,stroke:#6a8a6e,color:#243326,stroke-dasharray:4 3',
        ...nodes, ...edges, ...freeGroup,
    ].join('\n');
}

// Returns a NEW array. `before` = insert ahead of that card; omitted = append.
function moveCard(cards, id, { lane, before }) {
    const lanes = byLane(cards);
    const target = lanes[lane] ?? [];
    let order;
    if (before) {
        const i = target.findIndex(c => c.id === before);
        if (i > 0 && target[i - 1].id === id) {
            // The card is already immediately before its drop target in this lane —
            // halving the gap to the target would land back between the same two
            // neighbours (the "prev" boundary IS the moved card's own order), a
            // silent no-op. Place it after the target instead, so the drop moves it.
            const prev = target[i].order;
            const next = target[i + 1]?.order ?? prev + 20;
            order = (prev + next) / 2;
        } else {
            const next = target[i]?.order ?? 0;
            const prev = i > 0 ? target[i - 1].order : 0;
            order = (prev + next) / 2;
        }
    } else {
        order = (target.at(-1)?.order ?? 0) + 10;
    }
    return cards.map(c => c.id === id ? { ...c, lane, order } : c);
}

// ── State ──────────────────────────────────────────────────────────────────
let cards = SEED.map(c => ({ ...c }));
let db = null;                 // resolved capability, or null (read-only)
let unsub = null;
let ix = null;                 // blockerIndex, memoised per render (highlight() runs on every mouseover)
// Every db snapshot re-renders the whole board, so anything he is typing lives
// here, not in the DOM: a draft survives a re-render, and so does an open thread.
const drafts = Object.create(null);   // 'fb:<id>' | 'note:<id>' -> text
const openFb = new Set();             // card ids whose feedback thread is open

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
// A short code (A1, DZ, …) reads fine as "A1 · The -15 armor band…". A slug id
// doesn't — "5-zone-body-reconciliation · 5-Zone Body reconciliation" just says
// the same thing twice. Show whichever one is actually the readable half.
// (Named distinctly from board-model.js's own SHORT_CODE — that file's consts
// land in this same script's scope once build.py inlines it, and a duplicate
// top-level `const` of the same name would be a SyntaxError.)
const isShortCodeId = id => /^[A-Z]{1,3}\d?[a-z]?$/.test(id);

// ── Render ─────────────────────────────────────────────────────────────────
const TURN_ORDER = { ruling: 0, review: 1, ready: 2, idea: 3 };
const label = c => isShortCodeId(c.id) ? c.id : (c.title.length > 34 ? `${c.title.slice(0, 34)}…` : c.title);

function render() {
  // Hold on to the focused text box so a re-render does not steal it mid-word.
  const focusKey = document.activeElement?.dataset?.draft ?? null;
  const caret = focusKey ? document.activeElement.selectionStart : null;

  const lanes = byLane(cards);
  ix = blockerIndex(cards);
  const byId = Object.fromEntries(cards.map(c => [c.id, c]));

  const nx = nextSlice(cards);
  const nextLine = nx.reason === 'ok'
    ? `<span class="next">Loop takes next: <b>${esc(label(nx.pick))}</b></span>`
    : nx.reason === 'wip-cap'
      ? `<span class="next">Loop is paused — ${nx.wip} of ${WIP_CAP} branches wait on your merge</span>`
      : `<span class="next">Loop has nothing to build yet</span>`;
  const turnChips = (list, empty) => list.length
    ? list.map(t => byId[t.id]).filter(Boolean)
        .sort((a, b) => (TURN_ORDER[laneOf(a)] ?? 9) - (TURN_ORDER[laneOf(b)] ?? 9) || a.order - b.order)
        .map(c => `<button class="chip ${laneOf(c) === 'ruling' ? 'ruling' : kindOf(c)}" data-jump="${esc(c.id)}" title="${esc(list.find(t => t.id === c.id).why)}">${esc(label(c))}</button>`).join('')
    : `<span class="muted">${empty}</span>`;
  const yours = yourTurn(cards), claudes = claudesTurn(cards);
  $('#unblocked').innerHTML = `
    <div class="turnrow"><h2>Your turn · ${yours.length}</h2><div class="chips">${turnChips(yours, 'nothing waits on you')}</div></div>
    <div class="turnrow"><h2>Claude's turn · ${claudes.length}</h2><div class="chips">${turnChips(claudes, 'Claude is caught up')}</div>${nextLine}</div>`;

  $('#board').innerHTML = LANES.map(l => `
    <section class="lane" data-lane="${esc(l.id)}" aria-label="${esc(l.label)}">
      <h2>${esc(l.label)} <span class="count">${lanes[l.id].length}</span><small>${esc(l.hint)}</small></h2>
      <div class="cards" data-lane="${esc(l.id)}">${lanes[l.id].map(c => cardHTML(c, byId)).join('')}</div>
    </section>`).join('');

  $('#mermaid-src').textContent = mermaidSource(cards);
  bindDnD();
  if (focusKey) {
    const el = document.querySelector(`[data-draft="${CSS.escape(focusKey)}"]`);
    if (el) { el.focus({ preventScroll: true }); if (caret != null) el.setSelectionRange(caret, caret); }
  }
}

function cardHTML(c, byId) {
  const chip = (id, cls) => byId[id]
    ? `<button class="chip ${cls}" data-jump="${esc(id)}" title="${esc(byId[id].title)}">${esc(id)}</button>`
    : `<span class="chip ghost">${esc(id)}</span>`;
  const open = ix.openBlockedBy[c.id] ?? [];
  const kind = kindOf(c), lane = laneOf(c);
  const cls = lane === 'done' ? 'done' : lane === 'someday' ? 'someday' : kind;
  const list = (label, xs) => Array.isArray(xs) && xs.length
    ? `<p class="label">${esc(label)}</p><ul>${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  return `
    <article class="card ${cls}${open.length && lane !== 'done' ? ' blocked' : ''}" draggable="${db ? 'true' : 'false'}"
             data-id="${esc(c.id)}" tabindex="0">
      <header><b>${esc(c.id)}</b><span class="kind">${lane === 'done' ? '' : esc(kind)}</span>${c.size ? `<em>${esc(c.size)}</em>` : ''}</header>
      <p class="title">${esc(c.title)}</p>
      ${c.note ? `<p class="note">${esc(c.note).replace(/\n/g, '<br>')}</p>` : ''}
      ${kind === 'ruling' ? optionsHTML(c) : ''}
      ${actsHTML(c)}
      ${kind === 'slice' ? list('touches', c.touches) + list('done when', c.acceptance) : ''}
      ${c.branch ? `<p class="note"><span class="label">branch</span> <code>${esc(c.branch)}</code></p>` : ''}
      ${c.summary ? `<p class="note"><span class="label">run summary</span> ${esc(c.summary)}</p>` : ''}
      ${(ix.blockedBy[c.id] ?? []).length ? `<p class="row"><span>blocked by</span>${ix.blockedBy[c.id].map(id => chip(id, byId[id]?.lane === 'done' ? 'done' : 'ruling')).join('')}</p>` : ''}
      ${(ix.blocks[c.id] ?? []).length ? `<p class="row"><span>blocks</span>${ix.blocks[c.id].map(id => chip(id, 'build')).join('')}</p>` : ''}
      ${c.doc ? `<p class="doc">${esc(c.doc)}</p>` : ''}
      ${feedbackHTML(c)}
    </article>`;
}

// The one gesture each card is waiting for (plans/ticket-board.md §8).
function actsHTML(c) {
  const kind = kindOf(c), lane = laneOf(c), off = db ? '' : 'disabled';
  const btn = (act, text, go) => `<button class="act${go ? ' go' : ''}" data-act="${act}" data-id="${esc(c.id)}" ${off}>${text}</button>`;
  if (kind === 'ruling' && lane === 'ruling' && !(Array.isArray(c.options) && c.options.length))
    return `<p class="state">Claude writes this one's options next</p>`;
  if (kind === 'idea' && lane === 'idea')
    return c.triage?.choice === 'tweak'
      ? `<p class="state">Waiting on Claude to tweak it</p>`
      : `<div class="acts">${btn('tweak', 'Tweak it', true)}${btn('someday', 'Someday')}</div>`;
  if (kind === 'slice' && lane === 'ready' && Array.isArray(c.acceptance) && c.acceptance.length)
    return c.approved ? `<p class="state">Approved ✓ — the loop may build it</p>` : `<div class="acts">${btn('approve', 'Approve', true)}</div>`;
  if (lane === 'review')
    return c.verdict
      ? `<p class="state">${c.verdict.verdict === 'merge' ? 'Merge it ✓ — Claude merges next' : 'Changes asked ✓'}${c.verdict.note ? ` — “${esc(c.verdict.note)}”` : ''}</p>`
      : `<div class="acts">${btn('merge', 'Merge it', true)}${btn('changes', 'Changes (say what below)')}</div>`;
  return '';
}

// A short thread on the card: his lines and Claude's replies. Open by choice;
// it stays open across re-renders.
function feedbackHTML(c) {
  const thread = Array.isArray(c.feedback) ? c.feedback : [];
  const waiting = thread.length ? thread.at(-1).from : '';
  const key = `fb:${c.id}`;
  return `<details class="fb" data-fb="${esc(c.id)}" data-waiting="${waiting === 'you' ? 'claude' : ''}" ${openFb.has(c.id) ? 'open' : ''}>
    <summary>${thread.length ? `Feedback (${thread.length})${waiting === 'you' ? ' — waiting on Claude' : ''}` : 'Feedback'}</summary>
    ${thread.length ? `<div class="thread">${thread.map(f => `<p class="${f.from === 'claude' ? 'claude' : 'you'}"><b>${f.from === 'claude' ? 'Claude' : 'You'}</b>${esc(f.text).replace(/\n/g, '<br>')}</p>`).join('')}</div>` : ''}
    <div class="fb-row">
      <textarea class="pick-note" rows="1" data-draft="${esc(key)}" placeholder="Tell Claude anything about this card" ${db ? '' : 'disabled'}>${esc(drafts[key] ?? '')}</textarea>
      <button class="act" data-send="${esc(c.id)}" ${db ? '' : 'disabled'}>Send</button>
    </div>
  </details>`;
}

// A ruling's options are buttons while it is open and the store is writable;
// once answered, the pick stays visible and the buttons lock.
function optionsHTML(c) {
  const opts = Array.isArray(c.options) ? c.options : [];
  if (!opts.length) return '';
  const picked = c.pick?.option;
  const live = !!db && !picked;
  return `<div class="options" role="group" aria-label="Options">${opts.map(o => `
      <button class="opt${o.id === c.recommended ? ' rec' : ''}${o.id === picked ? ' picked' : ''}"
              data-answer="${esc(c.id)}" data-option="${esc(o.id)}" ${live ? '' : 'disabled'}>
        ${esc(o.label)}${o.id === c.recommended ? ' (recommended)' : ''}${o.id === picked ? ' ✓' : ''}
        ${o.detail ? `<small>${esc(o.detail)}</small>` : ''}
      </button>`).join('')}
    ${live ? `<textarea class="pick-note" data-note-for="${esc(c.id)}" data-draft="note:${esc(c.id)}" rows="1" placeholder="optional note with your pick">${esc(drafts[`note:${c.id}`] ?? '')}</textarea>` : ''}
    ${picked && c.pick?.note ? `<p class="note">“${esc(c.pick.note)}”</p>` : ''}
  </div>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-answer]'); if (!b || b.disabled || !db) return;
  const id = b.dataset.answer;
  const note = document.querySelector(`[data-note-for="${CSS.escape(id)}"]`)?.value ?? '';
  const next = answerRuling(cards, id, { option: b.dataset.option, note, at: Date.now() });
  if (next === cards) return;
  delete drafts[`note:${id}`];
  cards = next; render();
  const c = cards.find(x => x.id === id);
  await persist(c, { lane: c.lane, order: c.order, pick: c.pick });
});

// Typing goes to `drafts`, so a snapshot re-render never eats it.
document.addEventListener('input', e => { const k = e.target.dataset?.draft; if (k) drafts[k] = e.target.value; });
document.addEventListener('toggle', e => {
  const id = e.target.dataset?.fb; if (!id) return;
  e.target.open ? openFb.add(id) : openFb.delete(id);
}, true);

// Card gestures: Tweak it / Someday / Approve / Merge it / Changes / Send.
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act], [data-send]'); if (!b || b.disabled || !db) return;
  const at = Date.now();
  if (b.dataset.send) {
    const id = b.dataset.send, key = `fb:${id}`;
    const next = addFeedback(cards, id, drafts[key], at);
    if (next === cards) return;
    delete drafts[key];
    cards = next; render();
    await persist(cards.find(x => x.id === id), { feedback: cards.find(x => x.id === id).feedback });
    return;
  }
  const id = b.dataset.id, act = b.dataset.act;
  let next = cards, fields = c => ({});
  if (act === 'tweak' || act === 'someday') { next = triageIdea(cards, id, act, at); fields = c => ({ triage: c.triage, lane: c.lane, order: c.order }); }
  else if (act === 'approve') { next = approveSlice(cards, id, at); fields = c => ({ approved: c.approved }); }
  else if (act === 'merge' || act === 'changes') {
    const key = `fb:${id}`, note = (drafts[key] ?? '').trim();
    if (act === 'changes' && !note) {         // a change request needs words: open the box and wait
      openFb.add(id); render();
      document.querySelector(`[data-draft="${CSS.escape(key)}"]`)?.focus();
      setStatus('say what to change in the feedback box, then press Changes again');
      return;
    }
    next = reviewVerdict(cards, id, act, note, at);
    if (note) { next = addFeedback(next, id, note, at); delete drafts[key]; }
    fields = c => ({ verdict: c.verdict, ...(c.feedback ? { feedback: c.feedback } : {}) });
  }
  if (next === cards) return;
  cards = next; render();
  const c = cards.find(x => x.id === id);
  await persist(c, fields(c));
});

async function addIdea(e) {
  e.preventDefault();
  if (!db) return;
  const box = $('#idea-words');
  const card = newIdea(box.value, Date.now(), cards);
  if (!card) return;
  $('#idea-add').disabled = true;
  try {
    await db.doc(`cards/${card.id}`).set(card);
    box.value = '';
    setStatus(`idea added · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatus(`idea not saved: ${err.code ?? err.message} — your words are still in the box`);
  } finally {
    $('#idea-add').disabled = false;
  }
}

// ── Hover / focus: light up the connected subgraph ─────────────────────────
document.addEventListener('mouseover', e => highlight(e.target.closest('.card')?.dataset.id));
document.addEventListener('focusin',   e => highlight(e.target.closest('.card')?.dataset.id));
document.addEventListener('mouseout',  e => { if (!e.relatedTarget?.closest?.('.card')) highlight(null); });
function highlight(id) {
  if (!ix) return;
  const keep = id ? new Set([id, ...(ix.blockedBy[id] ?? []), ...(ix.blocks[id] ?? [])]) : null;
  for (const el of document.querySelectorAll('.card')) el.classList.toggle('dim', !!keep && !keep.has(el.dataset.id));
}
document.addEventListener('click', e => {
  const j = e.target.closest('[data-jump]'); if (!j) return;
  const el = document.querySelector(`.card[data-id="${CSS.escape(j.dataset.jump)}"]`);
  el?.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' }); el?.focus();
});

// ── Drag and drop (native; desktop) ────────────────────────────────────────
function bindDnD() {
  let dragging = null;
  for (const el of document.querySelectorAll('.card[draggable="true"]')) {
    el.addEventListener('dragstart', e => { dragging = el.dataset.id; e.dataTransfer.effectAllowed = 'move'; el.classList.add('lifting'); });
    el.addEventListener('dragend',   () => { dragging = null; el.classList.remove('lifting'); });
  }
  for (const zone of document.querySelectorAll('.cards')) {
    zone.addEventListener('dragover', e => { if (dragging) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } });
    zone.addEventListener('drop', async e => {
      e.preventDefault(); if (!dragging) return;
      const lane = zone.dataset.lane;
      const over = e.target.closest('.card');
      const before = over && over.dataset.id !== dragging ? over.dataset.id : undefined;
      const next = moveCard(cards, dragging, { lane, before });
      const moved = next.find(c => c.id === dragging);
      cards = next; render();
      await persist(moved, { lane: moved.lane, order: moved.order });
    });
  }
}

// ── Persistence: the artifact's own db ─────────────────────────────────────
async function persist(card, fields) {
  if (!db) return;
  try {
    await db.doc(`cards/${card.id}`).update(fields);
    setStatus(`saved · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatus(`save failed: ${err.code ?? err.message} — showing local state`);
  }
}
function setStatus(s) { $('#status').textContent = s; }

async function boot() {
  render();                                    // seed first: the page works with nothing
  $('#view-board').onclick = () => setView('board');
  $('#view-graph').onclick = () => setView('graph');

  if (typeof claude === 'undefined') { setStatus('read-only · not inside the artifact viewer'); return; }
  try {
    db = await claude.use('db');               // resolves later; null = read-only
  } catch (err) {
    setStatus(`read-only · db unavailable: ${err.code ?? err.message}`);
    return;
  }
  if (!db) { setStatus('read-only · no store in this view'); render(); return; }
  $('#ideabox').hidden = false;
  $('#ideabox').addEventListener('submit', addIdea);
  render();                                    // the ruling buttons unlock now that writes can land

  // Contract 0.2.41: `next` receives a QuerySnapshot — `.docs` is DocumentSnapshot[],
  // each with `.id`, `.exists`, `.data()`. Delivered snapshots and their data()
  // are FROZEN: never mutate them; moveCard returns fresh objects.
  // The first delivery may be `metadata.fromCache`; a definitive one follows.
  unsub = db.collection('cards').onSnapshot(
    snap => {
      if (snap.empty) { setStatus('connected · the store is empty'); return; }
      cards = snap.docs.map(d => d.data());
      render();
      setStatus(`live · ${snap.size} cards${snap.metadata.hasPendingWrites ? ' · saving…' : ''}`);
    },
    err => setStatus(`store error: ${err.code} — showing last known state`),   // terminal; listener is dead
  );
  setStatus('connected');
}
function setView(v) {
  $('#board').hidden = v !== 'board'; $('#unblocked').hidden = v !== 'board';
  $('#graph').hidden = v !== 'graph';
  $('#view-board').setAttribute('aria-pressed', v === 'board');
  $('#view-graph').setAttribute('aria-pressed', v === 'graph');
}
boot();
</script>
